name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays: catch new Go advisories, base image CVEs and runner changes
    # even in weeks with no commits.
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded pull request runs are cancelled; main keeps every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── 1. Go tests ─────────────────────────────────────────────────────────────
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: Run tests (race detector)
        run: go test -race ./... -count=1 -timeout=120s

      - name: Check coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./cmd/... ./internal/... | tee /tmp/cov.txt
          FAIL=0
          while IFS= read -r line; do
            [[ "${line}" == *"coverage:"* ]] || continue
            [[ "${line}" == *"[no statements]"* ]] && continue
            pct="$(sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p' <<<"${line}")"
            [[ -z "${pct}" ]] && continue
            if awk -v p="${pct}" 'BEGIN { exit !(p < 100.0) }'; then
              echo "coverage shortfall: ${line}"
              FAIL=1
            fi
          done < /tmp/cov.txt
          if [[ "${FAIL}" -ne 0 ]]; then echo "coverage check failed"; exit 1; fi
          echo "coverage check passed"

  # ── 1b. Known vulnerabilities ───────────────────────────────────────────────
  # Fails only on vulnerabilities in code the bouncer actually calls.
  # govulncheck is pinned in .github/tools/go.mod.
  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run -modfile=.github/tools/go.mod golang.org/x/vuln/cmd/govulncheck ./...

  # ── 2. Seccomp profile static validation ────────────────────────────────────
  validate-seccomp:
    name: Validate Seccomp Profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Validate syscall allowlist
        run: bash scripts/validate-seccomp.sh ./security/seccomp-bouncer.json

  # ── 3. Seccomp integration test ─────────────────────────────────────────────
  # Builds the real image and runs it under the seccomp profile with all the
  # same security options used in production. The bouncer keeps retrying the
  # (unreachable) LAPI until `timeout` stops it — that is expected. What must
  # NOT appear is the runc "reopen exec fifo" / "statx: operation not permitted"
  # error, which signals that seccomp blocked the container before the Go
  # binary ran.
  test-seccomp:
    name: Seccomp Integration Test
    runs-on: ubuntu-latest
    needs: validate-seccomp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sanity-check seccomp profile with Alpine (fast, no build)
        run: |
          # Exercises getdents64 (ls reads /proc/self/fd/) and execve (launching /bin/ls).
          # Fails in <5 s if these are missing, saving the 3-5 min full image build.
          docker run --rm \
            --security-opt "seccomp:./security/seccomp-bouncer.json" \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0 \
            ls /proc/self/fd

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: cs-bouncer-test:ci
          build-args: |
            VERSION=ci-seccomp-test
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cs-bouncer-test:ci
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.69.2

      - name: Run container under seccomp profile
        run: |
          set +e

          # Run with production security flags. The bouncer will fail to reach
          # the LAPI (expected) but must not be blocked by seccomp itself.
          output=$(timeout 20 docker run --rm \
            --security-opt "seccomp:./security/seccomp-bouncer.json" \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --read-only \
            --tmpfs /tmp:size=10M,uid=65532,gid=65532,mode=1777 \
            --tmpfs /data:size=50M,uid=65532,gid=65532 \
            -e CROWDSEC_LAPI_URL=http://no-such-host-ci-test:8080 \
            -e CROWDSEC_LAPI_KEY=ci-test-lapi-key \
            -e ABUSEIPDB_API_KEY=ci-test-abuseipdb-key \
            cs-bouncer-test:ci 2>&1)

          set -e

          echo "──── Container output ────────────────────────────────────────────"
          echo "$output"
          echo "──────────────────────────────────────────────────────────────────"

          # FAIL: runc was blocked by seccomp before the Go binary ran.
          # This is the exact error produced by a missing syscall in the profile.
          if echo "$output" | grep -qE "reopen exec fifo|error closing exec fds"; then
            echo ""
            echo "FAIL: seccomp profile blocked container startup (runc exec fifo error)."
            echo "      A required syscall is missing from security/seccomp-bouncer.json."
            echo "      Run:  bash scripts/validate-seccomp.sh"
            exit 1
          fi

          # FAIL: completely empty output is unexpected — something is very wrong.
          if [ -z "$output" ]; then
            echo ""
            echo "FAIL: no output from container — unexpected empty result."
            exit 1
          fi

          echo ""
          echo "PASS: container started under seccomp profile."
          echo "      (runc exec fifo completed; bouncer ran until stopped)"

      - name: Healthcheck works while the bouncer holds state.db
        run: |
          # Regression test: the HEALTHCHECK command must query /healthz over
          # HTTP, not open the bbolt file the running process has locked.
          docker run -d --name hc-test \
            --security-opt "seccomp:./security/seccomp-bouncer.json" \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --read-only \
            --tmpfs /tmp:size=10M,uid=65532,gid=65532,mode=1777 \
            --tmpfs /data:size=50M,uid=65532,gid=65532 \
            -e CROWDSEC_LAPI_URL=http://no-such-host-ci-test:8080 \
            -e CROWDSEC_LAPI_KEY=ci-test-lapi-key \
            -e ABUSEIPDB_API_KEY=ci-test-abuseipdb-key \
            cs-bouncer-test:ci
          trap 'docker logs hc-test; docker rm -f hc-test >/dev/null' EXIT

          for i in $(seq 1 20); do
            if docker exec hc-test /usr/local/bin/bouncer healthcheck; then
              echo "PASS: healthcheck succeeded during startup grace"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: healthcheck never succeeded"
          exit 1

  # ── 4. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # golangci-lint v2 (built with a Go that can lint this module's go directive).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
